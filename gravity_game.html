<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Ауырлық Күші - Интерактивті Ойын</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        .menu {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .menu-btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .menu-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.05);
        }

        .menu-btn:not(.active) {
            background: #f0f0f0;
            color: #666;
        }

        .menu-btn:hover {
            transform: scale(1.05);
        }

        .game-section {
            display: none;
        }

        .game-section.active {
            display: block;
        }

        .score-board {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
            font-size: 1.3em;
        }

        .planet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .planet-card {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .planet-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .planet-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .planet-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }

        .planet-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .planet-g {
            font-size: 1.1em;
            color: #555;
        }

        .planet-card.selected .planet-g {
            color: #fff;
        }

        .calculator {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .result {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.5em;
            margin-top: 20px;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.5s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            width: 100%;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .quiz-question {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .quiz-options {
            display: grid;
            gap: 15px;
        }

        .quiz-option {
            padding: 20px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
        }

        .quiz-option:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: #4ade80;
            color: white;
            border-color: #4ade80;
        }

        .quiz-option.wrong {
            background: #f87171;
            color: white;
            border-color: #f87171;
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.2em;
            text-align: center;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.5s;
        }

        .feedback.correct {
            background: #4ade80;
            color: white;
        }

        .feedback.wrong {
            background: #f87171;
            color: white;
        }

        .next-btn {
            margin-top: 20px;
            display: none;
        }

        .next-btn.show {
            display: block;
        }

        .final-score {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }

        .final-score h2 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
        }

        .final-score .score {
            font-size: 4em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .comparison-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .comparison-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.1em;
        }

        .comparison-table tr:nth-child(even) {
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🌍 Ауырлық Күші Ойыны</h1>
        <p class="subtitle">F = m × g формуласын ойын арқылы үйреніңіз!</p>

        <div class="menu">
            <button class="menu-btn active" onclick="switchGame('calculator')">🧮 Калькулятор</button>
            <button class="menu-btn" onclick="switchGame('quiz')">❓ Викторина</button>
            <button class="menu-btn" onclick="switchGame('compare')">🚀 Салыстыру</button>
        </div>

        <div class="score-board">
            <div>⭐ Ұпай: <span id="score">0</span></div>
            <div>✅ Дұрыс: <span id="correct">0</span></div>
            <div>❌ Қате: <span id="wrong">0</span></div>
        </div>

        <!-- Калькулятор ойыны -->
        <div id="calculator" class="game-section active">
            <div class="planet-grid" id="planetGrid"></div>
            
            <div class="calculator">
                <div class="input-group">
                    <label>📦 Массаны енгізіңіз (кг):</label>
                    <input type="number" id="massInput" placeholder="Мысалы: 50" step="0.1">
                </div>
                <button class="btn" onclick="calculateGravity()">Есептеу</button>
            </div>

            <div class="result" id="calcResult"></div>
        </div>

        <!-- Викторина -->
        <div id="quiz" class="game-section">
            <div class="quiz-question" id="quizQuestion"></div>
            <div class="feedback" id="quizFeedback"></div>
            <button class="btn next-btn" id="nextBtn" onclick="nextQuestion()">Келесі сұрақ</button>
        </div>

        <!-- Салыстыру -->
        <div id="compare" class="game-section">
            <div class="calculator">
                <div class="input-group">
                    <label>👤 Сіздің массаңыз (кг):</label>
                    <input type="number" id="compareInput" placeholder="Мысалы: 60" step="0.1">
                </div>
                <button class="btn" onclick="compareAllPlanets()">Барлық планеталарда салыстыр</button>
            </div>
            <div id="comparisonResult"></div>
        </div>
    </div>

    <script>
        const planets = [
            { name: "Жер", icon: "🌍", g: 10, color: "#4ade80" },
            { name: "Ай", icon: "🌙", g: 1.6, color: "#94a3b8" },
            { name: "Марс", icon: "🔴", g: 3.7, color: "#f87171" },
            { name: "Жұпитер", icon: "🪐", g: 25, color: "#fbbf24" },
            { name: "Венера", icon: "🟡", g: 8.9, color: "#fde047" },
            { name: "Сатурн", icon: "💫", g: 10.4, color: "#c084fc" }
        ];

        let selectedPlanet = planets[0];
        let score = 0;
        let correct = 0;
        let wrong = 0;
        let currentQuizIndex = 0;

        const quizQuestions = [
            {
                question: "Ауырлық күшінің формуласы қандай?",
                options: ["F = m × g", "F = m / g", "F = m + g", "F = m - g"],
                correct: 0
            },
            {
                question: "Жерде g-ның мәні қандай?",
                options: ["5 м/с²", "10 м/с²", "15 м/с²", "20 м/с²"],
                correct: 1
            },
            {
                question: "Массасы 5 кг дененің Жерде ауырлық күші қанша? (g=10)",
                options: ["25 Н", "50 Н", "75 Н", "100 Н"],
                correct: 1
            },
            {
                question: "Айда ауырлық күші Жерге қарағанда қалай өзгереді?",
                options: ["Артады", "Кемиді", "Өзгермейді", "Екі есе артады"],
                correct: 1
            },
            {
                question: "Егер F = 100 Н және g = 10 м/с² болса, масса қанша?",
                options: ["5 кг", "10 кг", "15 кг", "20 кг"],
                correct: 1
            },
            {
                question: "Қай планетада ауырлық күші ең үлкен?",
                options: ["Жер", "Марс", "Жұпитер", "Ай"],
                correct: 2
            },
            {
                question: "200 г алманың Жерде ауырлық күші қанша? (g=10)",
                options: ["0.2 Н", "2 Н", "20 Н", "200 Н"],
                correct: 1
            },
            {
                question: "Ауырлық күші несімен өлшенеді?",
                options: ["кг", "м/с²", "Н (Ньютон)", "метр"],
                correct: 2
            }
        ];

        function init() {
            renderPlanets();
            loadQuestion();
        }

        function renderPlanets() {
            const grid = document.getElementById('planetGrid');
            grid.innerHTML = planets.map((planet, index) => `
                <div class="planet-card ${index === 0 ? 'selected' : ''}" onclick="selectPlanet(${index})">
                    <div class="planet-icon">${planet.icon}</div>
                    <div class="planet-name">${planet.name}</div>
                    <div class="planet-g">g = ${planet.g} м/с²</div>
                </div>
            `).join('');
        }

        function selectPlanet(index) {
            selectedPlanet = planets[index];
            document.querySelectorAll('.planet-card').forEach((card, i) => {
                card.classList.toggle('selected', i === index);
            });
        }

        function calculateGravity() {
            const mass = parseFloat(document.getElementById('massInput').value);
            if (!mass || mass <= 0) {
                alert('Дұрыс масса енгізіңіз!');
                return;
            }

            const force = mass * selectedPlanet.g;
            const result = document.getElementById('calcResult');
            result.innerHTML = `
                <div>🎯 Нәтиже</div>
                <div style="font-size: 0.8em; margin-top: 10px;">
                    ${selectedPlanet.icon} ${selectedPlanet.name} планетасында
                </div>
                <div style="font-size: 2em; margin: 20px 0;">
                    F = ${force.toFixed(2)} Н
                </div>
                <div style="font-size: 0.9em;">
                    ${mass} кг × ${selectedPlanet.g} м/с² = ${force.toFixed(2)} Н
                </div>
            `;
            result.classList.add('show');

            updateScore(10);
        }

        function loadQuestion() {
            if (currentQuizIndex >= quizQuestions.length) {
                showFinalScore();
                return;
            }

            const q = quizQuestions[currentQuizIndex];
            const quizDiv = document.getElementById('quizQuestion');
            
            quizDiv.innerHTML = `
                <div class="question-text">Сұрақ ${currentQuizIndex + 1}/${quizQuestions.length}: ${q.question}</div>
                <div class="quiz-options">
                    ${q.options.map((opt, i) => `
                        <div class="quiz-option" onclick="checkAnswer(${i})">${opt}</div>
                    `).join('')}
                </div>
            `;

            document.getElementById('quizFeedback').classList.remove('show');
            document.getElementById('nextBtn').classList.remove('show');
        }

        function checkAnswer(selected) {
            const q = quizQuestions[currentQuizIndex];
            const options = document.querySelectorAll('.quiz-option');
            const feedback = document.getElementById('quizFeedback');
            
            options.forEach((opt, i) => {
                opt.style.pointerEvents = 'none';
                if (i === q.correct) {
                    opt.classList.add('correct');
                } else if (i === selected) {
                    opt.classList.add('wrong');
                }
            });

            if (selected === q.correct) {
                feedback.innerHTML = '✅ Дұрыс! Өте жақсы!';
                feedback.className = 'feedback show correct';
                updateScore(20);
                correct++;
            } else {
                feedback.innerHTML = `❌ Қате! Дұрыс жауап: ${q.options[q.correct]}`;
                feedback.className = 'feedback show wrong';
                wrong++;
            }

            document.getElementById('correct').textContent = correct;
            document.getElementById('wrong').textContent = wrong;
            document.getElementById('nextBtn').classList.add('show');
        }

        function nextQuestion() {
            currentQuizIndex++;
            loadQuestion();
        }

        function showFinalScore() {
            const quizDiv = document.getElementById('quizQuestion');
            const totalQuestions = quizQuestions.length;
            const percentage = (correct / totalQuestions * 100).toFixed(0);
            
            quizDiv.innerHTML = `
                <div class="final-score">
                    <h2>🎉 Викторина аяқталды!</h2>
                    <div class="score">${percentage}%</div>
                    <div style="font-size: 1.3em; margin: 20px 0;">
                        ✅ Дұрыс: ${correct} / ${totalQuestions}
                    </div>
                    <button class="btn" onclick="restartQuiz()">Қайта бастау</button>
                </div>
            `;
            document.getElementById('nextBtn').classList.remove('show');
        }

        function restartQuiz() {
            currentQuizIndex = 0;
            loadQuestion();
        }

        function compareAllPlanets() {
            const mass = parseFloat(document.getElementById('compareInput').value);
            if (!mass || mass <= 0) {
                alert('Дұрыс масса енгізіңіз!');
                return;
            }

            const resultDiv = document.getElementById('comparisonResult');
            resultDiv.innerHTML = `
                <table class="comparison-table">
                    <thead>
                        <tr>
                            <th>Планета</th>
                            <th>g (м/с²)</th>
                            <th>Ауырлық күші (Н)</th>
                            <th>Салыстыру</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${planets.map(planet => {
                            const force = mass * planet.g;
                            const earthForce = mass * 10;
                            const ratio = (force / earthForce * 100).toFixed(0);
                            return `
                                <tr>
                                    <td>${planet.icon} ${planet.name}</td>
                                    <td>${planet.g}</td>
                                    <td><strong>${force.toFixed(2)} Н</strong></td>
                                    <td>${ratio}% Жерден</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;

            updateScore(15);
        }

        function updateScore(points) {
            score += points;
            document.getElementById('score').textContent = score;
        }

        function switchGame(gameId) {
            document.querySelectorAll('.game-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(gameId).classList.add('active');

            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        init();
    </script>
</body>
</html>
